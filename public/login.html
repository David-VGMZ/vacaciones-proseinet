<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestor de Vacaciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css?v=0.001">
</head>

<body>
    <div id="login-screen" class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
        <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%; border-radius: 15px;">
            <div class="text-center mb-4">
                <img src="/img/Logo-proseinet-rojo.png" alt="Logo Proseinet" width="100">
                <h4 class="mt-3 fw-bold text-center" style="color: #c71c1c;">Gestor de Vacaciones</h4>
            </div>
            <form id="login-form">
                <div class="mb-3">
                    <input type="email" id="login-email" class="form-control border-0 border-bottom" required
                        placeholder="Correo Electrónico">
                </div>
                <div class="mb-3">
                    <div class="input-group">
                        <input type="password" id="login-pass" class="form-control border-0 border-bottom" required
                            placeholder="Contraseña">
                        <button class="btn btn-outline-secondary border-0 border-bottom" type="button"
                            id="toggle-password" title="Mostrar/Ocultar contraseña">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="btnEntrar" class="btn btn-danger w-100 py-2 fw-bold">Entrar</button>
            </form>
            <div id="login-error" class="text-danger small mt-3 text-center" style="display: none;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/loginSrc.js?v=0.00107"></script>
    <script src="/firebase-config.js?v=0.001"></script>
</body>

</html>
